<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>สุ่มคำ - Game</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1>ห้อง <span id="roomCode">-</span></h1>
        <div class="sub">ชื่อมึง: <b id="yourName">-</b> <span id="hostBadge" class="badge"></span></div>
      </div>
      <div class="right">
        <div class="timer">
          <div class="timer-label">เวลา</div>
          <div id="timerText" class="timer-value">--:--</div>
        </div>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2>ผู้เล่น</h2>
        <div id="players" class="list"></div>
        <div class="row">
          <button id="btnLeave" class="ghost">ออกห้อง</button>
        </div>
      </div>

      <div class="card">
        <h2>ใส่คำของมึง</h2>
        <p class="hint">คำนี้จะถูกเอาไปสุ่มให้คนอื่น (มึงห้ามได้คำตัวเอง)</p>
        <input id="wordInput" placeholder="เช่น แฟนเก่า / รถเมล์ / ข้าวมันไก่" maxlength="40" />
        <div class="row">
          <button id="btnSubmit" class="primary">ส่งคำ</button>
          <span id="wordStatus" class="hint"></span>
        </div>

        <hr />

        <div class="row">
          <label class="hint">เวลารอบ (วินาที)</label>
          <input id="durationSec" type="number" min="10" max="300" value="60" style="max-width:120px" />
        </div>

        <div class="row">
          <button id="btnStart" class="primary">Start Round (Host)</button>
          <button id="btnReset" class="danger">Reset (Host)</button>
        </div>

        <p id="msg" class="hint"></p>
      </div>
    </div>

    <div class="card">
      <h2>ผลรวม (มึงจะไม่เห็นคำของตัวเอง)</h2>
      <div id="results" class="results"></div>
      <p class="hint">คนอื่นจะเห็นคำของมึง แต่ตัวมึงไม่เห็นของตัวเอง — ตามกติกา 😈</p>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
