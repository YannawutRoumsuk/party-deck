<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>คำต้องห้าม - Game</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div>
        <h1>ห้อง <span id="roomCode">-</span></h1>
        <div class="sub">ชื่อของเอ็งอะ: <b id="yourName">-</b> <span id="hostBadge" class="badge"></span></div>
      </div>
      <div class="right">
        <div class="timer">
          <div class="timer-label">เวลา</div>
          <div id="timerText" class="timer-value">--:--</div>
        </div>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <h2>ผู้เล่น</h2>
        <div id="players" class="list"></div>
        <div class="row">
          <button id="btnLeave" class="ghost">ออกจากห้อง</button>
        </div>
      </div>

      <div class="card">
        <h2>ใส่คำ ที่ต้องการ </h2>
        <p class="hint">คำนี้จะถูกเอาไปสุ่มให้คนอื่น</p>
        <input id="wordInput" placeholder="เช่น กิน / รถ / ไก่" maxlength="40" />
        <div class="row">
          <button id="btnSubmit" class="primary">ส่งคำ</button>
          <span id="wordStatus" class="hint"></span>
        </div>

        <hr />

        <div class="row">
          <label class="hint">เวลารอบ (วินาที)</label>
          <input id="durationMin" type="number" min="1" max="5" value="1" style="max-width:120px" />
        </div>

        <div class="row">
          <button id="btnStart" class="primary">Start Round (Host)</button>
          <button id="btnPause" class="secondary">Pause (Host)</button>
          <button id="btnReset" class="danger">Reset (Host)</button>
        </div>

        <p id="msg" class="hint"></p>
      </div>
    </div>

    <div class="card">
      <h2>รายชื่อคำของแต่ละผู้เล่น</h2>
      <div id="results" class="results"></div>
      <p class="hint">คำที่คุณส่งไปจะถูกสุ่มให้ผู้เล่นคนอื่น และคุณจะไม่สามารถเห็นคำที่คุณได้รับจากการสุ่ม — ตามกฏ 😈</p>
    </div>

    <div class="card">
      <h2>คำแนะนำ</h2>
      <div id="results" class="results"></div>
      <p class="hint">ควรกำหนด กติกาให้ชัดเจนก่อนเริ่มใส่คำ เช่น 1พยางค์ทุกคน / คำกริยาทั้งหมด  </p>
    </div>

  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/client.js"></script>
</body>
</html>
